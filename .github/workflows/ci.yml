# CI: prove every push to main and every PR — unit + emulator tests, Android
# lint, and a debug APK uploaded as a rolling artifact.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No explicit SDK install step: the ubuntu runner image ships the Android
      # SDK, and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: blipbird-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumentation (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            runner: ubuntu-latest
          - api-level: 35
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Migration and UI instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.numShards=1 -Pandroid.testInstrumentationRunnerArguments.shardIndex=0
